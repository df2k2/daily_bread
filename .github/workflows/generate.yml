name: Generate devotional

on:
  workflow_dispatch:
    inputs:
      reference:
        description: "Optional passage override (e.g. 'John 3:16-21')"
        required: false
      slot:
        description: "morning or evening"
        required: false
        default: ""
      skip_image:
        description: "Skip image generation"
        type: boolean
        default: false
      skip_notify:
        description: "Skip email/SMS notifications"
        type: boolean
        default: false
  schedule:
    # Times are UTC. Add ~10 min margin for GH Actions cron drift.
    - cron: "10 13 * * *"   # ~06:00 America/Los_Angeles (PDT, UTC-7)
    - cron: "10 1 * * *"    # ~18:00 America/Los_Angeles (PDT, UTC-7)

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.reference }}" ]; then ARGS+=(--reference "${{ inputs.reference }}"); fi
          if [ -n "${{ inputs.slot }}" ]; then ARGS+=(--slot "${{ inputs.slot }}"); fi
          if [ "${{ inputs.skip_image }}" = "true" ]; then ARGS+=(--skip-image); fi
          if [ "${{ inputs.skip_notify }}" = "true" ]; then ARGS+=(--skip-notify); fi
          python -m scripts.generate_devotional "${ARGS[@]}"

      - name: Commit content
        run: |
          git config user.name "devotional-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/ data/state.json data/bibles/web.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "devotional: $(date -u +%Y-%m-%d-%H%M)"
          git push
