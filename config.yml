schedule:
  frequency: 1
  times: ["06:00"]
  timezone: "America/Los_Angeles"

content:
  translation: "WEB"
  reading_plan: "random"
  passage_length: "short"
  tone: "warm, conversational, hopeful"

ai:
  provider: "gemini"
  text_model: "gemini-3.1-pro-preview"
  image_model: "gemini-3.1-pro-preview"
  use_search_grounding: false
  validate_verses: true

image:
  enabled: true
  style: "soft watercolor, peaceful, biblical scene, no faces of deity, symbolic"
  aspect_ratio: "3:2"
  resolution: "1536x1024"

notifications:
  email:
    provider: "resend"
    from: "Daily Bread <devotional@example.com>"
  sms:
    provider: "twilio"
    from: "+15550000000"
  # Each recipient opts into channels and slots. Omit a channel
  # field to skip that channel for them. Empty `slots` = both.
  recipients: []
    # - name: "Alice"
    #   email: "alice@example.com"
    #   sms: "+15551234567"
    #   slots: ["morning"]
    #   channels: ["email"]
    # - name: "Bob"
    #   email: "bob@example.com"
    #   slots: []
    #   channels: ["email", "sms"]

site:
  title: "Daily Bread"
  base_url: "https://username.github.io/daily_bread"
