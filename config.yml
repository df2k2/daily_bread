schedule:
  # NOTE: actual run times live in the cron lines of
  # .github/workflows/generate.yml (currently twice daily: ~06:00 and
  # ~18:00). Only `timezone` below is read by the pipeline — it decides the
  # morning/evening slot and localizes dates. `frequency`/`times` are
  # reference-only; edit the workflow to change when generation runs.
  frequency: 2
  times: ["06:00", "18:00"]
  timezone: "America/Los_Angeles"

content:
  primary_language: "en"
  languages:
    en:
      label: "English"
      translation: "NLT"
    pt:
      label: "Português (BR)"
      translation: "PT-NVI"
  reading_plan: "random"
  passage_length: "short"
  tone: "warm, conversational, hopeful"

ai:
  provider: "gemini"
  text_model: "gemini-3.1-pro-preview"
  image_model: "gemini-3.1-flash-image-preview"
  use_search_grounding: false
  validate_verses: true

image:
  enabled: true
  style: "soft watercolor, peaceful, biblical scene, no faces of deity, symbolic"
  aspect_ratio: "3:2"
  resolution: "1536x1024"

notifications:
  email:
    provider: "resend"
    from: "Daily Bread <devotional@example.com>"
  sms:
    provider: "twilio"
    from: "+15550000000"
  # Each recipient opts into channels, slots, and language.
  # `language`: "en" or "pt" (defaults to content.primary_language).
  # `slots`:    list of "morning" / "evening" (empty = both).
  # `channels`: list of "email" / "sms" (defaults to whichever
  #             addresses are present).
  recipients: []
    # - name: "Alice"
    #   email: "alice@example.com"
    #   language: "en"
    #   slots: ["morning"]
    #   channels: ["email"]
    # - name: "Bruno"
    #   email: "bruno@example.com"
    #   sms: "+5511999999999"
    #   language: "pt"
    #   slots: []
    #   channels: ["email", "sms"]

site:
  title: "Daily Bread"
  base_url: "https://df2k2.github.io/daily_bread"
